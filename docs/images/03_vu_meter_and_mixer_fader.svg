<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 410" width="360" height="410">
  <defs>
    <radialGradient id="vuGlow" cx="50%" cy="65%" r="65%">
      <stop offset="0%" stop-color="#F39624"/>
      <stop offset="45%" stop-color="#D37311"/>
      <stop offset="80%" stop-color="#853D04"/>
      <stop offset="100%" stop-color="#261000"/>
    </radialGradient>
    <linearGradient id="faderCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3E3C3A"/>
      <stop offset="20%" stop-color="#282624"/>
      <stop offset="50%" stop-color="#141312"/>
      <stop offset="80%" stop-color="#282624"/>
      <stop offset="100%" stop-color="#3A3836"/>
    </linearGradient>
  </defs>
  <rect width="360" height="410" rx="28" fill="#1C1B19" stroke="#3A3633" stroke-width="1.5"/>
  <!-- Outer VU SurfaceContainerHigh -->
  <rect x="20" y="18" width="320" height="252" rx="28" fill="#2C2926"/>
  <!-- Top-right internal tabular badge -->
  <rect x="266" y="32" width="58" height="28" rx="12" fill="#373430" stroke="#3A3633" stroke-width="1"/>
  <text x="295" y="51" text-anchor="middle" fill="#FC6000" font-family="monospace" font-size="14" font-weight="900">15 s</text>

  <!-- Vintage Chassis & Backlit Display -->
  <rect x="36" y="70" width="288" height="165" rx="12" fill="#181818" stroke="#2A2A2A" stroke-width="2"/>
  <rect x="44" y="78" width="272" height="149" rx="6" fill="url(#vuGlow)" stroke="#000000" stroke-width="1.5"/>

  <!-- Scale Arc (0..50 Black, 50..60 Red) -->
  <path d="M 76 196 A 130 130 0 0 1 246 155" fill="none" stroke="#000000" stroke-width="2.5"/>
  <path d="M 246 155 A 130 130 0 0 1 284 196" fill="none" stroke="#D32F2F" stroke-width="3.5"/>

  <!-- Scale Numbers -->
  <text x="86" y="182" fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold">0</text>
  <text x="112" y="152" fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold">10</text>
  <text x="145" y="134" fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold">20</text>
  <text x="180" y="130" fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold">30</text>
  <text x="215" y="138" fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold">40</text>
  <text x="244" y="156" fill="#D32F2F" font-family="sans-serif" font-size="11" font-weight="bold">50</text>
  <text x="268" y="182" fill="#D32F2F" font-family="sans-serif" font-size="11" font-weight="bold">60</text>

  <!-- Physical Needle pointing to 15s -->
  <line x1="180" y1="227" x2="128" y2="112" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
  <circle cx="180" cy="220" r="14" fill="#222222"/>
  <circle cx="180" cy="220" r="8" fill="#444444"/>
  <!-- SEC Label -->
  <text x="180" y="212" text-anchor="middle" fill="#1A0E00" font-family="serif" font-size="18" font-weight="bold" letter-spacing="4">SEC</text>
  <!-- Peak Red LED -->
  <circle cx="298" cy="94" r="6" fill="#5A1010" stroke="#000000" stroke-width="1"/>

  <text x="180" y="256" text-anchor="middle" fill="#C7BFB7" font-family="sans-serif" font-size="10">Trascina la lancetta sul quadrante o usa lo slider sottostante</text>

  <!-- Analog Mixer Horizontal Fader -->
  <!-- Calibration Ticks -->
  <g stroke="#8A827A" stroke-width="1.5">
    <line x1="40" y1="296" x2="40" y2="306" stroke="#FC6000"/>
    <line x1="68" y1="296" x2="68" y2="306" stroke="#FC6000"/>
    <line x1="96" y1="296" x2="96" y2="306" stroke="#FC6000"/>
    <line x1="124" y1="296" x2="124" y2="306"/>
    <line x1="152" y1="296" x2="152" y2="306"/>
    <line x1="180" y1="296" x2="180" y2="306"/>
    <line x1="208" y1="296" x2="208" y2="306"/>
    <line x1="236" y1="296" x2="236" y2="306"/>
    <line x1="264" y1="296" x2="264" y2="306"/>
    <line x1="292" y1="296" x2="292" y2="306"/>
    <line x1="320" y1="296" x2="320" y2="306"/>
    <line x1="40" y1="328" x2="40" y2="338" stroke="#FC6000"/>
    <line x1="68" y1="328" x2="68" y2="338" stroke="#FC6000"/>
    <line x1="96" y1="328" x2="96" y2="338" stroke="#FC6000"/>
    <line x1="124" y1="328" x2="124" y2="338"/>
    <line x1="152" y1="328" x2="152" y2="338"/>
    <line x1="180" y1="328" x2="180" y2="338"/>
    <line x1="208" y1="328" x2="208" y2="338"/>
    <line x1="236" y1="328" x2="236" y2="338"/>
    <line x1="264" y1="328" x2="264" y2="338"/>
    <line x1="292" y1="328" x2="292" y2="338"/>
    <line x1="320" y1="328" x2="320" y2="338"/>
  </g>
  <!-- Recessed Fader Slot -->
  <rect x="24" y="312" width="312" height="10" rx="3" fill="#080808" stroke="#2C2926" stroke-width="1"/>
  <rect x="26" y="316" width="82" height="2" fill="#FC6000"/>
  <!-- 3D Concave Fader Cap -->
  <rect x="86" y="291" width="38" height="52" rx="4" fill="url(#faderCap)" stroke="#0A0A0A" stroke-width="1.5"/>
  <rect x="93" y="298" width="2" height="38" fill="#111111"/>
  <rect x="98" y="296" width="2" height="42" fill="#111111"/>
  <rect x="103" y="293" width="4" height="48" rx="1" fill="#FC6000"/>
  <rect x="110" y="296" width="2" height="42" fill="#111111"/>
  <rect x="115" y="298" width="2" height="38" fill="#111111"/>

  <text x="24" y="372" fill="#8A827A" font-family="monospace" font-size="11" font-weight="bold">5 s (Min)</text>
  <text x="336" y="372" text-anchor="end" fill="#8A827A" font-family="monospace" font-size="11" font-weight="bold">60 s (Max)</text>
</svg>
