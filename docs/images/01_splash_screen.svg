<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 740" width="360" height="740">
  <rect width="360" height="740" rx="36" fill="#000000" stroke="#2C2926" stroke-width="4"/>
  <!-- Status Bar -->
  <text x="28" y="30" fill="#8A827A" font-family="sans-serif" font-size="11" font-weight="bold">09:41</text>
  <circle cx="180" cy="24" r="6" fill="#141312"/>
  <rect x="305" y="21" width="22" height="10" rx="2" fill="none" stroke="#8A827A" stroke-width="1.5"/>
  <rect x="307" y="23" width="16" height="6" fill="#FC6000"/>
  <!-- Center Splash Logo Emblem -->
  <g transform="translate(180, 310)">
    <circle cx="0" cy="0" r="88" fill="#0B0500" stroke="#3D1600" stroke-width="2"/>
    <circle cx="0" cy="0" r="68" fill="#180900" stroke="#FC6000" stroke-width="3"/>
    <!-- Soundwave + Play Stylized Emblem -->
    <rect x="-42" y="-18" width="8" height="36" rx="4" fill="#FC6000"/>
    <rect x="-26" y="-34" width="8" height="68" rx="4" fill="#FFB74D"/>
    <rect x="-10" y="-46" width="8" height="92" rx="4" fill="#FFFFFF"/>
    <rect x="6" y="-28" width="8" height="56" rx="4" fill="#FC6000"/>
    <polygon points="22,-22 50,0 22,22" fill="#FC6000"/>
  </g>
  <!-- ORANGEBEAT Wordmark -->
  <text x="180" y="445" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="900" letter-spacing="4">
    <tspan fill="#FFFFFF">ORANGE</tspan><tspan fill="#FC6000">BEAT</tspan>
  </text>
  <!-- Bottom Version Name -->
  <text x="180" y="696" text-anchor="middle" fill="#8A827A" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="2">v1.0.0</text>
</svg>
