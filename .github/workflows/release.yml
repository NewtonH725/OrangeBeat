name: Release Orange-Beat (Android, Ubuntu, Windows)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version tag (e.g. v3.0.0)'
        required: true
        default: 'v3.0.0'

permissions:
  contents: write

jobs:
  build-android-and-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (includes jpackage)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build Android APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build Ubuntu .deb package
        run: ./gradlew :desktop:packageDeb --no-daemon

      - name: Rename artifacts with app version
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          mkdir -p release-artifacts

          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$APK_PATH" "release-artifacts/OrangeBeat-${TAG}-android.apk"

          DEB_PATH=$(find desktop/build/compose/binaries/main/deb -name "*.deb" | head -n 1)
          cp "$DEB_PATH" "release-artifacts/OrangeBeat-${TAG}-ubuntu-amd64.deb"

      - name: Upload Android & Ubuntu artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-android-ubuntu
          path: release-artifacts/*

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (includes jpackage + WiX)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Determine version tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build Windows .msi installer
        run: .\gradlew.bat :desktop:packageMsi --no-daemon

      - name: Rename Windows artifact with app version
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          mkdir -p release-artifacts
          MSI_PATH=$(find desktop/build/compose/binaries/main/msi -name "*.msi" | head -n 1)
          cp "$MSI_PATH" "release-artifacts/OrangeBeat-${TAG}-windows-x64.msi"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-windows
          path: release-artifacts/*

  publish-release:
    needs: [build-android-and-ubuntu, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android & Ubuntu artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-android-ubuntu
          path: release-artifacts

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-windows
          path: release-artifacts

      - name: Determine version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with all 3 platform installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Orange-Beat ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: release-artifacts/*
